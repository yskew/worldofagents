services:
  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/frontend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.local
    depends_on:
      - api
    networks:
      - internal

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: agentverify
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: agentverify
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentverify"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
